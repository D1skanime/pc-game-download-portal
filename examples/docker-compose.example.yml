# ZockArchive manual prebuilt-image example. Build the local tag first.
# This tag is not a verified registry publication; prefer the Git Portainer stack.
volumes:
  pgdp_mysql_data:
  pgdp_resources:
  pgdp_redis_data:

services:
  pgdp:
    image: pc-game-download-portal:latest
    container_name: pgdp
    restart: unless-stopped
    environment:
      - DB_HOST=pgdp-db
      - DB_NAME=pgdp # Should match MARIADB_DATABASE in mariadb
      - DB_USER=pgdp-user # Should match MARIADB_USER in mariadb
      - DB_PASSWD= # Should match MARIADB_PASSWORD in mariadb
      - ROMM_AUTH_SECRET_KEY= # Generate a key with `openssl rand -hex 32`
      - SCREENSCRAPER_USER= # These are the recommended metadata providers
      - SCREENSCRAPER_PASSWORD= # Upstream RomM reference: https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#screenscraper
      - RETROACHIEVEMENTS_API_KEY= # Upstream RomM reference: https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#retroachievements
      - STEAMGRIDDB_API_KEY= # Upstream RomM reference: https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#steamgriddb
      - HASHEOUS_API_ENABLED=true # Upstream RomM reference: https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#hasheous
    volumes:
      - pgdp_resources:/romm/resources # Resources fetched from IGDB (covers, screenshots, etc.)
      - pgdp_redis_data:/redis-data # Cached data for background tasks
      - /path/to/library:/romm/library:ro # Upstream RomM reference: Your game library. Check https://docs.romm.app/latest/Getting-Started/Folder-Structure/ for more details.
      - /path/to/assets:/romm/assets # Uploaded saves, states, etc.
      - /path/to/config:/romm/config # (Optional) Path where config.yml is stored
    ports:
      - 80:8080
    depends_on:
      pgdp-db:
        condition: service_healthy
        restart: true

  pgdp-db:
    image: mariadb:latest
    container_name: pgdp-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD= # Use a unique, secure password
      - MARIADB_DATABASE=pgdp
      - MARIADB_USER=pgdp-user
      - MARIADB_PASSWORD=
    volumes:
      - pgdp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
