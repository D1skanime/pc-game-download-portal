<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#9205f2" />
    <meta name="msapplication-TileColor" content="#9205f2" />
    <meta name="theme-color" content="#2a0145" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZockArchive</title>
  </head>

  <body>
    <div id="app">
      <div id="app-loading-logo">
        <span>ZockArchive</span>
      </div>
    </div>

    <style>
      #app-loading-logo {
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        z-index: 1020 !important;
        background-color: rgba(242, 244, 248) !important;
      }

      #app-loading-logo {
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          "Inter",
          Roboto,
          sans-serif;
        font-size: 32px;
        font-weight: 600;
        line-height: 1.1;
        color: #111117;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: rgba(13, 17, 23) !important;
        }

        #app-loading-logo {
          background-color: rgba(13, 17, 23) !important;
          color: #ffffff;
        }
      }
    </style>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
