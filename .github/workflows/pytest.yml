name: Run Pytest

on:
  pull_request:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pytest.yml"
  push:
    branches:
      - "master"
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pytest.yml"

permissions: read-all

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        db: [mariadb, postgresql]
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Verify CI target contracts
        run: python3 -m unittest discover -s backend/tools/tests -p 'test_ci_target.py' -v

      - name: Build locked backend test image
        run: docker build -f backend/tools/ci.Dockerfile -t pgdp-ci:latest .

      - name: Run complete Python suite on a verified disposable target
        id: target
        run: python3 backend/tools/ci_target.py --dialect ${{ matrix.db }} pytest

      - name: Retain target, test, and cleanup receipts
        if: always() && steps.target.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ matrix.db }}-evidence
          path: ${{ steps.target.outputs.evidence }}
          retention-days: 14
