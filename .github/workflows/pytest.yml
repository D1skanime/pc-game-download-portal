name: Run Pytest

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "docker/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "*.md"
      - "env.template"
      - ".github/**"
      - ".agents/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pytest.yml"
  push:
    branches:
      - "master"
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "docker/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "*.md"
      - "env.template"
      - ".github/**"
      - ".agents/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pytest.yml"

permissions: read-all

jobs:
  host-contracts:
    name: Required host contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Run complete-checkout contracts and record exact source
        id: host
        run: python3 backend/tools/ci_host_contracts.py

      - name: Retain host contract source, membership and test results
        if: always() && steps.host.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-contracts-evidence
          path: ${{ steps.host.outputs.evidence }}
          retention-days: 14

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        db: [mariadb, postgresql]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Verify CI target contracts
        run: python3 -m unittest discover -s backend/tools/tests -p 'test_ci_target.py' -v

      - name: Build locked backend test image
        run: docker build -f backend/tools/ci.Dockerfile -t pgdp-ci:latest .

      - name: Run complete Python suite on a verified disposable target
        id: target
        run: python3 backend/tools/ci_target.py --dialect ${{ matrix.db }} --shard ${{ matrix.shard }} pytest

      - name: Retain target, test, and cleanup receipts
        if: always() && steps.target.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ matrix.db }}-shard-${{ matrix.shard }}-evidence
          path: ${{ steps.target.outputs.evidence }}
          retention-days: 14
