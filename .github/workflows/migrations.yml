name: Run Migrations

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/models/**"
      - "backend/utils/alembic_mysql.py"
      - "backend/tools/phase34*"
      - "backend/tools/ci*"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/migrations.yml"

permissions:
  contents: read

jobs:
  migrate:
    name: migrate-${{ matrix.dialect }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dialect: [mariadb, mysql, postgresql]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build disposable backend runner
        run: docker build -f backend/tools/ci.Dockerfile -t pgdp-ci:latest .

      - name: Verify fresh migrations and scan schema round trip
        id: schema
        run: python3 backend/tools/ci_target.py --dialect ${{ matrix.dialect }} schema

      - name: Upload migration evidence
        if: always() && steps.schema.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migrations-${{ matrix.dialect }}
          path: ${{ steps.schema.outputs.evidence }}
          retention-days: 7
