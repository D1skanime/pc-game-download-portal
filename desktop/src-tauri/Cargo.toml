[package]
name = "romm-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
romm-download-core = { path = "../crates/romm-download-core" }
serde = { version = "=1.0.229", features = ["derive"] }
