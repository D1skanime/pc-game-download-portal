[package]
name = "romm-download-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-normalization = "=0.1.25"
unicode-casefold = "=0.2.0"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
sha2 = "=0.10.9"
